<!DOCTYPE html>
<html>
<head>
    <title>Terminal Line Ending Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .terminal-container { height: 300px; background: #000; }
        #log { background: #f0f0f0; padding: 10px; font-family: monospace; max-height: 200px; overflow-y: auto; }
        button { margin: 5px; padding: 10px; }
        .status { font-weight: bold; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Terminal Line Ending Debug Test</h1>

    <div class="test-section">
        <h2>Test Configuration</h2>
        <button onclick="testWithConvertEol(false)">Test with convertEol: false</button>
        <button onclick="testWithConvertEol(true)">Test with convertEol: true</button>
        <button onclick="connectWebSocket()">Connect to Real Server</button>
        <button onclick="clearAll()">Clear All</button>
    </div>

    <div class="test-section">
        <h2>Terminal 1: convertEol = false (current setting)</h2>
        <div id="terminal1" class="terminal-container"></div>
        <div id="status1" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Terminal 2: convertEol = true (proposed fix)</h2>
        <div id="terminal2" class="terminal-container"></div>
        <div id="status2" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Debug Log</h2>
        <div id="log"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script>
        let term1, term2;
        let ws = null;
        const log = document.getElementById('log');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function hexDump(data) {
            let result = '';
            for (let i = 0; i < data.length; i++) {
                const code = data.charCodeAt(i);
                if (code === 10) result += '\\n';
                else if (code === 13) result += '\\r';
                else if (code >= 32 && code <= 126) result += data[i];
                else result += `\\x${code.toString(16).padStart(2, '0')}`;
            }
            return result;
        }

        function initTerminals() {
            // Terminal 1: convertEol = false (current)
            term1 = new Terminal({
                convertEol: false,
                fontSize: 14,
                theme: { background: '#1e1e1e', foreground: '#d4d4d4' }
            });
            term1.open(document.getElementById('terminal1'));

            // Terminal 2: convertEol = true (proposed)
            term2 = new Terminal({
                convertEol: true,
                fontSize: 14,
                theme: { background: '#1e1e1e', foreground: '#d4d4d4' }
            });
            term2.open(document.getElementById('terminal2'));

            addLog('Terminals initialized');
        }

        function testWithConvertEol(setting) {
            addLog(`Testing with convertEol: ${setting}`);

            // Test strings with different line endings
            const tests = [
                { name: 'LF only', data: 'Line 1\nLine 2\nLine 3\n' },
                { name: 'CRLF', data: 'Line 1\r\nLine 2\r\nLine 3\r\n' },
                { name: 'Mixed', data: 'Line 1\nLine 2\r\nLine 3\n' },
                { name: 'Claude Box', data: '│ Test │\n│ Box  │\n' },
                { name: 'Prompt', data: '> command\n' }
            ];

            tests.forEach(test => {
                addLog(`  ${test.name}: ${hexDump(test.data)}`);
                term1.writeln(`[${test.name}]`);
                term1.write(test.data);
                term2.writeln(`[${test.name}]`);
                term2.write(test.data);
            });

            // Check results
            const status1 = document.getElementById('status1');
            const status2 = document.getElementById('status2');

            status1.textContent = 'Check if lines appear correctly (no extra blanks)';
            status2.textContent = 'Check if lines appear correctly (no extra blanks)';
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'claude.adoom.nyc';
            const wsUrl = `${protocol}//${host}/ws/terminal`;

            addLog(`Connecting to ${wsUrl}`);

            if (ws) ws.close();
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addLog('WebSocket connected');
                ws.send(JSON.stringify({ type: 'ping' }));
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'pty_data') {
                        const decoded = atob(msg.data);
                        addLog(`Received PTY data: ${hexDump(decoded.substring(0, 50))}...`);

                        // Write to both terminals
                        term1.write(decoded);
                        term2.write(decoded);
                    }
                } catch (e) {
                    addLog(`Error: ${e.message}`);
                }
            };

            ws.onerror = (e) => addLog(`WebSocket error: ${e}`);
            ws.onclose = () => addLog('WebSocket closed');
        }

        function clearAll() {
            term1.clear();
            term2.clear();
            log.innerHTML = '';
            addLog('Cleared all');
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initTerminals();
            addLog('Page loaded - ready for testing');
        });
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 76" role="img" aria-label="Cloude Code">
  <!-- Cloud and bird mark. Primitives copied verbatim from cloud_mark() in
       packaging/dmg/artwork/make-background.py (the DMG background
       generator) so this header asset and the installer/app icon stay the
       same drawing instead of two hand-maintained copies. Colours match
       that script's CLOUD_LIGHT/CLOUD_SHADE/BIRD_EYE constants and the
       accent / accent-strong CSS variables in
       client/css/themes/claude/theme.json. -->
  <defs>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cddcea"/>
    </linearGradient>
    <linearGradient id="birdFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88768"/>
      <stop offset="1" stop-color="#d77757"/>
    </linearGradient>
  </defs>
  <g fill="url(#birdFill)"><rect x="45" y="0" width="32" height="44" rx="3"/><rect x="39" y="9" width="8" height="26" rx="2"/></g>
  <rect x="53" y="14" width="6" height="9" fill="#3a1f18"/>
  <rect x="67" y="14" width="6" height="9" fill="#3a1f18"/>
  <g fill="url(#cloudFill)"><circle cx="32" cy="52" r="18"/><circle cx="60" cy="46" r="22"/><circle cx="88" cy="52" r="19"/><rect x="28" y="50" width="62" height="21" rx="10"/></g>
</svg>

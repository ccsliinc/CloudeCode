<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Controller</title>

    <!-- xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #d77757;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #1177bb;
        }

        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button.danger {
            background: #c5000b;
        }

        button.danger:hover:not(:disabled) {
            background: #e81123;
        }

        .status {
            padding: 8px 16px;
            border-radius: 4px;
            background: #3e3e42;
            display: inline-block;
            font-size: 14px;
        }

        .status.connected {
            background: #0e7219;
        }

        .status.error {
            background: #c5000b;
        }

        .terminal-container {
            flex: 1;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #terminal {
            flex: 1;
            background: #1e1e1e;
        }

        .info {
            background: #2d2d30;
            padding: 10px 20px;
            border-top: 1px solid #3e3e42;
            font-size: 12px;
            color: #858585;
        }

        .tunnels {
            background: #252526;
            padding: 15px 20px;
            border-top: 1px solid #3e3e42;
        }

        .tunnels h3 {
            margin-bottom: 10px;
            color: #4ec9b0;
            font-size: 1.1rem;
        }

        .tunnel-item {
            background: #2d2d30;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #4ec9b0;
        }

        /* Prevent line-height/letter-spacing from bleeding into xterm measurement */
        .xterm, .xterm * {
            line-height: normal !important;
            letter-spacing: normal !important;
            font-kerning: normal !important;
        }

        .tunnel-item a {
            color: #569cd6;
            text-decoration: none;
        }

        .tunnel-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>☁️ Cloude Code</h1>
        <div class="controls">
            <button onclick="createSession()" id="createSessionBtn">Create Session</button>
            <button onclick="connectWebSocket()" id="connectWsBtn" disabled>Connect Terminal</button>
            <button onclick="destroySession()" id="destroySessionBtn" class="danger" disabled>Destroy Session</button>
            <span class="status" id="statusText">Ready</span>
        </div>
    </div>

    <div class="terminal-container">
        <div id="terminal"></div>
    </div>

    <div class="tunnels" id="tunnelsContainer" style="display: none;">
        <h3>Active Tunnels</h3>
        <div id="tunnelsList"></div>
    </div>

    <div class="info">
        <span id="sessionInfo">No active session</span>
    </div>

    <!-- xterm.js -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-webgl@0.16.0/lib/xterm-addon-webgl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.js"></script>

    <script>
        // API configuration
        const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;

        const API_BASE = `${protocol}//${host}/api/v1`;
        const WS_URL = `${wsProtocol}//${host}/ws/terminal`;

        let ws = null;
        let sessionActive = false;
        let term = null;
        let fitAddon = null;

        // Single-writer queue for PTY data
        const queue = [];
        let flushing = false;

        function enqueue(bytes) {
            queue.push(bytes);
            if (!flushing) {
                flushing = true;
                requestAnimationFrame(flush);
            }
        }

        function flush() {
            // merge queue into a single Uint8Array
            let total = 0;
            for (const c of queue) total += c.length;
            const merged = new Uint8Array(total);
            let o = 0;
            while (queue.length) {
                const c = queue.shift();
                merged.set(c, o);
                o += c.length;
            }
            // Write once; use callback to signal completion
            term.write(merged, () => {
                flushing = false;
                if (queue.length) requestAnimationFrame(flush);
            });
        }

        // Initialize xterm.js terminal
        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: '"SF Mono", monospace',
                fontWeight: 'normal',
                fontWeightBold: 'bold',
                allowTransparency: false,
                theme: {
                    background: '#1e1e1e',
                    foreground: '#d4d4d4',
                    cursor: '#d4d4d4',
                    black: '#000000',
                    red: '#cd3131',
                    green: '#0dbc79',
                    yellow: '#e5e510',
                    blue: '#2472c8',
                    magenta: '#bc3fbc',
                    cyan: '#11a8cd',
                    white: '#e5e5e5',
                    brightBlack: '#666666',
                    brightRed: '#f14c4c',
                    brightGreen: '#23d18b',
                    brightYellow: '#f5f543',
                    brightBlue: '#3b8eea',
                    brightMagenta: '#d670d6',
                    brightCyan: '#29b8db',
                    brightWhite: '#ffffff'
                },
                allowProposedApi: true,
                convertEol: false,  // PTY handles EOL, avoid double-translation
                scrollback: 10000,
                windowsMode: false
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            // Load WebGL renderer for better performance and Unicode support
            try {
                const webglAddon = new WebglAddon.WebglAddon();
                term.loadAddon(webglAddon);
            } catch (e) {
                console.warn('WebGL addon not available, using canvas renderer', e);
            }

            // Load Unicode 11 addon for better character support
            try {
                const unicode11Addon = new Unicode11Addon.Unicode11Addon();
                term.loadAddon(unicode11Addon);
                term.unicode.activeVersion = '11';
            } catch (e) {
                console.warn('Unicode11 addon not available', e);
            }

            term.open(document.getElementById('terminal'));

            // Handle terminal input - send as raw bytes
            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    // Send input as binary frame
                    ws.send(new TextEncoder().encode(data));
                }
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                if (fitAddon) {
                    fitAddon.fit();
                    sendResize();
                }
            });

            term.writeln('\x1b[1;32mClaude Code Controller Terminal\x1b[0m');
            term.writeln('Waiting for session...\n');
        }

        // Send resize event to server
        function sendResize() {
            if (ws && ws.readyState === WebSocket.OPEN && term) {
                ws.send(JSON.stringify({
                    type: 'pty_resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }

        // Create session
        async function createSession() {
            try {
                updateStatus('Creating session...', 'status');

                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auto_start_claude: true })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to create session');
                }

                const session = await response.json();
                console.log('Session created:', session);

                sessionActive = true;
                updateStatus('Session created! Connecting...', 'status connected');

                document.getElementById('createSessionBtn').disabled = true;
                document.getElementById('destroySessionBtn').disabled = false;
                document.getElementById('connectWsBtn').disabled = false;

                // Auto-connect WebSocket
                setTimeout(connectWebSocket, 500);

            } catch (error) {
                console.error('Error creating session:', error);

                // If session already exists, connect to it
                if (error.message.includes('already running')) {
                    if (term) {
                        term.writeln('\x1b[1;33m[Session already exists - connecting...]\x1b[0m');
                    }
                    updateStatus('Connecting to existing session...', 'status');

                    // Check and connect to existing session
                    setTimeout(async () => {
                        const hasSession = await checkExistingSession();
                        if (hasSession) {
                            updateStatus('Connected to existing session', 'status connected');
                        }
                    }, 500);
                } else {
                    updateStatus('Error: ' + error.message, 'status error');
                    if (term) {
                        term.writeln(`\x1b[1;31m[Error: ${error.message}]\x1b[0m`);
                    }
                }
            }
        }

        // Check for existing session
        async function checkExistingSession() {
            try {
                console.log('Checking for existing session...');
                const response = await fetch(`${API_BASE}/sessions`);
                console.log('Session check response status:', response.status);

                if (!response.ok) {
                    console.log('No existing session found (response not ok)');
                    return false;
                }

                const data = await response.json();
                console.log('Session data:', data);

                // API returns {session: {...}, ...} structure
                const session = data.session || data;

                if (session && session.id) {
                    console.log('Valid session found:', session.id);
                    sessionActive = true;
                    updateStatus('Existing session found', 'status connected');

                    document.getElementById('createSessionBtn').disabled = true;
                    document.getElementById('destroySessionBtn').disabled = false;
                    document.getElementById('connectWsBtn').disabled = false;
                    document.getElementById('sessionInfo').textContent =
                        `Session: ${session.id} | PID: ${session.pty_pid} | Uptime: ${Math.floor((Date.now() - new Date(session.created_at)) / 1000)}s`;

                    if (term) {
                        term.writeln('\x1b[1;32m[Existing session found - connecting to WebSocket...]\x1b[0m');
                    }

                    // Auto-connect WebSocket
                    setTimeout(connectWebSocket, 500);

                    // Load tunnels
                    loadTunnels();

                    return true;
                }

                console.log('Session data invalid or missing');
                return false;
            } catch (error) {
                console.error('Error checking existing session:', error);
                if (term) {
                    term.writeln(`\x1b[1;31m[Error checking session: ${error.message}]\x1b[0m`);
                }
                return false;
            }
        }

        // Destroy session
        async function destroySession() {
            try {
                updateStatus('Destroying session...', 'status');

                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to destroy session');

                sessionActive = false;

                if (ws) {
                    ws.close();
                    ws = null;
                }

                updateStatus('Session destroyed', 'status');

                document.getElementById('createSessionBtn').disabled = false;
                document.getElementById('destroySessionBtn').disabled = true;
                document.getElementById('connectWsBtn').disabled = true;
                document.getElementById('sessionInfo').textContent = 'No active session';

                if (term) {
                    term.clear();
                    term.writeln('\x1b[1;31mSession destroyed\x1b[0m\n');
                }

            } catch (error) {
                console.error('Error destroying session:', error);
                updateStatus('Error: ' + error.message, 'status error');
            }
        }

        // Wait for fonts and layout to be ready
        async function waitForFontsAndLayout(container) {
            if (document.fonts?.ready) {
                try { await document.fonts.ready; } catch {}
            }
            // Ensure the container has non-zero size
            const t0 = performance.now();
            while ((container.offsetWidth|0) === 0 || (container.offsetHeight|0) === 0) {
                if (performance.now() - t0 > 2000) break;
                await new Promise(r => setTimeout(r, 16));
            }
            // Let layout settle
            await new Promise(requestAnimationFrame);
            await new Promise(requestAnimationFrame);
        }

        // Connect WebSocket
        async function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('Already connected');
                return;
            }

            updateStatus('Connecting to terminal...', 'status');

            // Wait for fonts and layout before connecting
            const container = document.getElementById('terminal');
            await waitForFontsAndLayout(container);
            fitAddon.fit();

            // Send resize notification (will be sent again after connection)
            console.log('Terminal size:', term.cols, 'x', term.rows);

            // Now connect
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';
            setupWebSocketHandlers();
        }

        // Setup WebSocket event handlers (extracted from connectWebSocket)
        function setupWebSocketHandlers() {
            if (!ws) return;

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus('Connected', 'status connected');

                if (term) {
                    term.writeln('\x1b[1;32m[Connected to PTY terminal]\x1b[0m\n');
                }

                // Send initial resize with real dimensions
                sendResize();
            };

            ws.onmessage = (event) => {
                // Handle binary frames (PTY data)
                if (event.data instanceof ArrayBuffer) {
                    enqueue(new Uint8Array(event.data));
                    return;
                }

                // Handle JSON control messages
                try {
                    const message = JSON.parse(event.data);
                    handleWebSocketMessage(message);
                } catch (error) {
                    console.error('Failed to parse message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('WebSocket error', 'status error');
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                updateStatus('Disconnected', 'status');
                ws = null;

                if (term) {
                    term.writeln('\n\x1b[1;31m[Disconnected from terminal]\x1b[0m');
                }
            };
        }


        // Handle WebSocket messages
        function handleWebSocketMessage(message) {
            const type = message.type;

            // Note: pty_data is now handled as binary frames, not JSON
            if (type === 'log') {
                // System log message
                if (term && message.content) {
                    term.writeln(`\x1b[1;33m${message.content}\x1b[0m`);
                }
            } else if (type === 'tunnel_created') {
                // Tunnel created
                if (term) {
                    term.writeln(`\x1b[1;36m[Tunnel created: ${message.tunnel.public_url}]\x1b[0m`);
                }
                loadTunnels();
            } else if (type === 'error') {
                // Error message
                if (term) {
                    term.writeln(`\x1b[1;31m[Error: ${message.message}]\x1b[0m`);
                }
            }
        }

        // Load tunnels
        async function loadTunnels() {
            try {
                const response = await fetch(`${API_BASE}/tunnels`);
                if (!response.ok) return;

                const tunnels = await response.json();
                const container = document.getElementById('tunnelsContainer');
                const list = document.getElementById('tunnelsList');

                if (tunnels.length > 0) {
                    container.style.display = 'block';
                    list.innerHTML = tunnels.map(tunnel => `
                        <div class="tunnel-item">
                            <strong>Port ${tunnel.port}:</strong>
                            <a href="${tunnel.public_url}" target="_blank">${tunnel.public_url}</a>
                        </div>
                    `).join('');
                } else {
                    container.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading tunnels:', error);
            }
        }

        // Update status
        function updateStatus(text, className) {
            const statusEl = document.getElementById('statusText');
            statusEl.textContent = text;
            statusEl.className = className;
        }

        // Initialize on load
        window.addEventListener('load', async () => {
            initTerminal();

            // Always try to check for existing session first
            if (term) {
                term.writeln('\x1b[1;36m[Checking for existing session...]\x1b[0m');
            }

            try {
                const hasExisting = await checkExistingSession();

                // If no existing session, auto-create one
                if (!hasExisting) {
                    if (term) {
                        term.writeln('\x1b[1;33m[No existing session found - creating new session...]\x1b[0m');
                    }
                    setTimeout(createSession, 500);
                }
            } catch (error) {
                console.error('Error during initialization:', error);
                if (term) {
                    term.writeln('\x1b[1;31m[Error checking session - will retry...]\x1b[0m');
                }
                // Retry after a delay
                setTimeout(() => checkExistingSession(), 2000);
            }
        });
    </script>
</body>
</html>

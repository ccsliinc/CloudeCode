<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the page paint edge to edge on a notched
         iPhone instead of letterboxing between two grey bars. It hands us
         responsibility for the insets in exchange; client/css/ios-chrome.css
         pays that with env(safe-area-inset-*). Both values are inert on a
         desktop browser, so this does not change the web-first layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>☁️ Cloude Code</title>

    <!-- iOS home-screen app chrome.
         WHAT THIS ACTUALLY BUYS OVER PLAIN HTTP: iOS "Add to Home Screen"
         reads these tags with no secure-context requirement, so the icon,
         the standalone (chrome-less) window and the status bar style all
         work on a Tailscale http:// origin. What does NOT work over plain
         http is anything gated on window.isSecureContext - service
         workers, Cache API, and therefore any offline/background story.
         There is deliberately NO service worker registered here: it would
         fail to register on this origin, and a registration that silently
         never takes is worse than none. See docs/ios-standalone.md. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent puts our own background under the status bar,
         which is why ios-chrome.css must pad the header by the top inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cloude">
    <!-- The app version, stamped server-side by src/main.py's
         `{{VERSION}}` substitution. It used to be a `<span class="version">`
         chip inside the header `<h1>`; it now renders in the home screen's
         bottom bar, which is built by launchpad.js at runtime and so has
         no server-rendered markup of its own to stamp. A meta tag is the
         handoff: main.py's replace() is a plain string substitution and
         does not care where the token lives, and Launchpad reads it back
         with one querySelector. Empty content means the version could not
         be resolved, and the chip renders nothing at all. -->
    <meta name="cloude-app-version" content="{{VERSION}}">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- iOS ignores manifest icons and reads this instead. PNG only. -->
    <link rel="apple-touch-icon" href="/static/assets/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/assets/icons/icon-192.png">

    <!-- Vendored xterm.js CSS (see client/vendor/xterm/VERSION.md) - served
         from this app's own origin instead of cdn.jsdelivr.net. A CDN
         request blocked or delayed by an ad blocker (Brave Shields on
         mobile, confirmed) leaves xterm's character-measurement element
         without its rules; the backend pane size still comes out right,
         so only the on-device render breaks. Same-origin removes the
         failure class instead of hoping the CDN answers. Must load in
         <head>, before styles.css, so app CSS can still override xterm's
         defaults. -->
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css" />
    <!-- v0.7.0 Part 2: toast notification styles. Loaded after styles.css so
         theme CSS custom properties (--color-accent, etc.) are available
         as fallbacks for the per-toast accent border. -->
    <link rel="stylesheet" href="/static/css/toast.css" />
    <!-- Session sidebar + status lights. Loaded after styles.css for the
         same token-availability reason as toast.css. -->
    <link rel="stylesheet" href="/static/css/session-sidebar.css" />
    <!-- Session tools button + menu and the per-session theme picker.
         After styles.css so it inherits the theme vars, AND so its
         explicit width/height beat the bare `button` base rule there. -->
    <link rel="stylesheet" href="/static/css/terminal-tools.css" />
    <!-- The copy-output sheet those tools open. Split from
         terminal-tools.css at the 500-line limit; same load reasoning. -->
    <link rel="stylesheet" href="/static/css/copy-output.css" />
    <!-- The paste fallback the "paste from clipboard" tool opens when the
         origin is not a secure context. Same load reasoning again. -->
    <link rel="stylesheet" href="/static/css/paste-fallback.css" />
    <!-- Stacked-modal chrome (scroll lock + what a COVERED modal looks
         like). Must load before the two config-editor stylesheets, which
         style the modals that stack. -->
    <link rel="stylesheet" href="/static/css/modal-stack.css" />
    <link rel="stylesheet" href="/static/css/config-editor.css" />
    <link rel="stylesheet" href="/static/css/config-editor-modal.css" />
    <!-- Mobile header dropdown (client/js/header-menu.js) and iOS
         safe-area chrome. Both load after styles.css: the first needs the
         theme custom properties, the second must win on equal specificity
         where it re-pads the header. -->
    <link rel="stylesheet" href="/static/css/header-menu.css" />
    <!-- The home screen's thin bottom bar. Must load BEFORE ios-chrome.css,
         which overrides its --home-bar-inset token with the real
         env(safe-area-inset-bottom) and excludes #launchpad-screen from the
         generic `.screen` bottom inset. -->
    <link rel="stylesheet" href="/static/css/home-bar.css" />
    <link rel="stylesheet" href="/static/css/ios-chrome.css" />
    <!-- Two-line common-command chips. After styles.css, which owns the
         base .command-button rule this narrows. -->
    <link rel="stylesheet" href="/static/css/slash-command-chips.css" />

    <!-- The settings panel's music volume slider. After styles.css, which
         owns the .settings-field rules this builds on. -->
    <link rel="stylesheet" href="/static/css/settings-audio.css" />

    <!-- The home bar's server-status panel. After styles.css, which owns
         the .modal-overlay / .modal-header / .modal-body chrome it rides
         on and the bare `button` reset its controls have to escape. -->
    <link rel="stylesheet" href="/static/css/server-status.css" />

    <!-- Session rows painted in their own session's theme colours. MUST be
         the last of the app stylesheets: it competes at equal specificity
         with the row backgrounds in styles.css and session-sidebar.css, so
         source order is what decides whether the wash survives a hover. -->
    <link rel="stylesheet" href="/static/css/session-theme-tint.css" />

    <!-- Phase 2: dynamic href slot for bundled themes' optional theme.css.
         Phase 3 will populate this when the user picks a non-Claude theme. -->
    <link rel="stylesheet" id="theme-css" />
</head>
<body>
    <!-- Item 9: deep-link error banner. Populated by router.js when the
         URL contains `/session/<invalid>`. Hidden by default. -->
    <div id="deep-link-error" style="display:none; background:#c00; color:#fff; padding:8px; text-align:center"></div>

    <div class="header">
        <!-- Session sidebar hamburger - top-left of the terminal screen
             header. Hidden on auth/launchpad (toggled by app.js exactly
             like logoutBtn/destroyBtn). A real <button> with
             aria-expanded/aria-controls per the accessibility pattern
             already established for header controls in this file. -->
        <button type="button" id="session-sidebar-toggle" class="session-sidebar-toggle hidden"
                aria-expanded="false" aria-controls="session-sidebar-panel"
                aria-label="Conversations" title="conversations">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <h1 id="appTitle">
            <span id="header-icon" class="header-icon" aria-hidden="true">☁️</span>
            <span id="header-title-text">Cloude Code</span>
            <!-- NO VERSION CHIP HERE ANY MORE. It moved to the home
                 screen's bottom bar (client/css/home-bar.css). It was a
                 fixed-width, flex-shrink: 0 sibling of the title, so every
                 pixel it occupied came straight off the title's truncation
                 budget on every screen including the terminal, where the
                 title is a session name that needs the room. See
                 client/js/header-title-fit.js, which subtracts each
                 non-shrinking sibling from the budget and therefore
                 recovers this width with no code change. -->
        </h1>
        <div class="controls">
            <!-- Logout: door frame (three-sided bracket, open on the right)
                 with an arrow passing all the way THROUGH and past it — the
                 near-universal "log out" glyph. Deliberately different from
                 detach above (see its comment). -->
            <button onclick="App.logout()" id="logoutBtn" class="hidden" aria-label="Logout" title="logout" data-tooltip="Logout">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M7 2.5H3.75C3.05964 2.5 2.5 3.05964 2.5 3.75V12.25C2.5 12.9404 3.05964 13.5 3.75 13.5H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.25 8H13.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M10.5 5.25L13.25 8L10.5 10.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <!-- Settings: gear/cog — a ring with six radial teeth, the one
                 icon in this family built from a circle rather than a
                 closed silhouette (house/box/door/trash) or an open
                 speaker-shape, so it reads as structurally distinct from
                 all five neighbors at a glance. Opens SettingsPanel (see
                 client/js/settings-panel.js), which now owns the theme
                 chooser that used to live directly in this header — see
                 that file for why it mounts ThemeSelector into the panel
                 instead of `.header .controls`. Always visible (not
                 gated behind session state like home/detach/logout)
                 because settings apply whether or not a session is open. -->
            <button type="button" id="settingsBtn" class="hidden" aria-label="Settings" title="settings" data-tooltip="Settings">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="4.2" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="8" cy="8" r="1.6" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 3.8V2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 5.9L13.02 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 10.1L13.02 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 12.2V13.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 10.1L2.98 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 5.9L2.98 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Config editor: browse/edit ~/.claude (+ the active project's
                 .claude/) — see client/js/config-editor-panel.js. Same
                 always-visible treatment as settingsBtn: config applies
                 whether or not a session is open. Icon is an open folder,
                 distinct from settings' gear-circle and every other glyph
                 in this row. -->
            <button type="button" id="configEditorBtn" class="hidden" aria-label="File editor" title="file editor" data-tooltip="file editor" aria-expanded="false" aria-controls="config-editor-panel">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 5.25C2 4.69772 2.44772 4.25 3 4.25H6.5L7.75 5.75H13C13.5523 5.75 14 6.19772 14 6.75V11.25C14 11.8023 13.5523 12.25 13 12.25H3C2.44772 12.25 2 11.8023 2 11.25V5.25Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </button>
            <!-- Connection light. ONE node, re-parented between here and
                 the home screen's bottom bar by App._placeStatusLight() -
                 never cloned, for the same reason header-menu.js moves
                 nodes rather than mirroring them: it is addressed by id by
                 app.js and terminal.js.

                 `tabindex="0"` is the non-hover path to its text. The
                 `.status::after` tooltip used to be reachable ONLY by
                 hover, which on a phone meant a coloured circle with no
                 way to learn what it means. A tap focuses it and
                 `.status:focus::after` reveals the same string; tapping
                 away blurs it. On the home screen the bar renders the
                 text outright and this tooltip is suppressed. -->
            <span class="status" id="statusText" data-status="Ready" tabindex="0"
                  role="status" aria-live="polite" aria-label="Ready"></span>
        </div>
    </div>
    <!-- New-action speed-dial FAB markup is now injected inline into the
         launchpad's "running sessions" section heading by launchpad.js
         (renderLaunchpadUI). The full-screen click-outside backdrop stays
         here at top-level so it can blanket the viewport when open. -->
    <div class="new-fab__backdrop" id="new-fab-backdrop" hidden></div>

    <!-- Session sidebar - conversation switcher for the terminal view.
         Markup lives at body level (not inside #terminal-screen) so it can
         slide over the full viewport; visibility is CSS-driven by the
         .session-sidebar-panel--open class (client/js/session-sidebar.js). -->
    <div class="session-sidebar-backdrop" id="session-sidebar-backdrop" hidden></div>
    <aside id="session-sidebar-panel" class="session-sidebar-panel" aria-hidden="true" aria-label="Conversations">
        <div class="session-sidebar-header">
            <span class="session-sidebar-title">conversations</span>
            <!-- Pin the BAR open (docked, no backdrop, survives a
                 conversation switch). aria-pressed carries the real state;
                 the pushpin glyph is presentational. Hidden below 700px by
                 client/js/session-sidebar-pin.js — a docked 320px bar on a
                 phone leaves nothing for the terminal. -->
            <button type="button" id="session-sidebar-pin" class="session-sidebar-pin"
                    aria-pressed="false" aria-label="Pin sidebar open" title="pin sidebar open">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="17" x2="12" y2="22"/>
                    <path d="M5 17h14l-2-4V4H7v9l-2 4z"/>
                </svg>
            </button>
            <button type="button" id="session-sidebar-close" aria-label="Close conversations" title="close">&times;</button>
        </div>
        <div id="session-sidebar-list" class="session-sidebar-list"></div>
    </aside>

    <!-- FILE EDITOR file picker - a real modal now (it used to be a
         right-hand slide-over panel), so it and the editor that opens
         over it are the same kind of surface. Both register with
         client/js/modal-stack.js, which is what makes Escape close only
         the top one and what takes this one off screen entirely on a
         phone while the editor sits above it. Scope is the claude config
         directories plus the active project's working directory, never a general
         filesystem browser. See client/js/config-editor-panel.js. -->
    <div class="modal-overlay config-editor-picker-overlay" id="config-editor-overlay" hidden data-modal="config-picker">
        <div class="config-editor-picker-content" role="dialog" aria-modal="true" aria-labelledby="config-editor-title">
            <div class="modal-header config-editor-header">
                <span class="config-editor-title" id="config-editor-title">file editor</span>
                <!-- Create a new file. Sits next to the title rather than on
                     each directory row because a tree row is already a
                     <button> and a button cannot nest another one; the
                     prompt this opens asks for the root and the path
                     instead. See client/js/config-editor-new-file.js. -->
                <button type="button" id="config-editor-new" class="config-editor-new"
                        aria-label="New file" title="new file">+ new file</button>
                <button type="button" id="config-editor-close" aria-label="Close file editor" title="close">&times;</button>
            </div>
            <div class="modal-body config-editor-body">
                <div id="config-editor-tree" class="config-editor-tree"></div>
            </div>
        </div>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="screen"></div>

    <!-- Launchpad Screen -->
    <div id="launchpad-screen" class="screen"></div>

    <!-- Terminal Screen -->
    <div id="terminal-screen" class="screen">
        <!-- NO TOOL STRIP IN THE TOP-RIGHT CORNER. A folded three-icon
             strip used to float here holding copy output / session theme
             / session music, while a second paperclip menu in the
             bottom-right held paste / attach image. The STRIP is gone for
             good - it covered terminal output across its whole width.
             Its contents were re-split by JOB rather than by corner:
             #terminalToolsBtn moves content, #sessionEditorBtn configures
             the session. Both are at the bottom of this file, and the
             session editor alone is pinned back over this corner as a
             SINGLE 45px button. One button is not a strip; do not grow it
             back into one. -->

        <div class="terminal-container">
            <div id="terminal"></div>
        </div>

        <div class="local-servers" id="localServersContainer" style="display: none;">
            <h3>Local Servers</h3>
            <div id="localServersList"></div>
        </div>

        <div class="info">
            <span id="sessionInfo">No active session</span>
        </div>
    </div>

    <!-- Vendored xterm.js + addons (see client/vendor/xterm/VERSION.md) -
         served from this app's own origin so the terminal no longer
         depends on cdn.jsdelivr.net being reachable. -->
    <script src="/static/vendor/xterm/xterm.js"></script>
    <script src="/static/vendor/xterm/xterm-addon-fit.js"></script>
    <script src="/static/vendor/xterm/xterm-addon-webgl.js"></script>
    <script src="/static/vendor/xterm/xterm-addon-unicode11.js"></script>

    <!-- Application modules -->
    <!-- Shared click-dismissal guard. Loaded FIRST because it is a
         dependency of anything that closes on click - slash-commands.js,
         header-menu.js and app.js all call window.DismissGuard while
         wiring their listeners. See that file for the two shipped bugs it
         exists to retire. -->
    <script src="/static/js/dismiss-guard.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <!-- v0.7.0 Part 2 — toast manager loaded EARLY so window.ToastManager
         is defined before terminal.js's WS message handler dispatches
         toast.new / toast.ack frames. -->
    <script src="/static/js/toast.js"></script>
    <!-- Shared status-dot rendering. Must load BEFORE launchpad.js and
         session-sidebar.js, both of which call window.SessionStatusUI. -->
    <script src="/static/js/session-status-ui.js"></script>
    <!-- Shared X (close) / trash (remove) row control: which one a session
         row gets, its tooltip, and its confirm copy. Must load AFTER
         session-status-ui.js (uses its glyphs) and BEFORE launchpad.js,
         terminal.js and session-sidebar.js, all of which call
         window.SessionRowActions. -->
    <script src="/static/js/session-row-actions.js"></script>
    <!-- Per-row session-theme colours. Must load BEFORE launchpad.js and
         session-sidebar-rows.js, both of which call
         window.SessionThemeTint. It reads themes/registry.js lazily at
         paint time rather than at load, so it does not have to come after
         it, and it degrades to today's plain row while the registry is
         still fetching. -->
    <script src="/static/js/session-theme-tint.js"></script>
    <script src="/static/js/launchpad.js"></script>
    <!-- Provider selector modal (new project / open-folder / clone-github /
         existing-project launch gate). Must load AFTER launchpad.js — it
         attaches showProviderModal() onto the window.Launchpad instance. -->
    <!-- provider-groups.js holds the launch picker's family-grouping
         rules and MUST load before providers.js calls them. -->
    <script src="/static/js/provider-groups.js"></script>
    <script src="/static/js/providers.js"></script>
    <!-- Server-restart detector (health polling + backoff). Must load
         BEFORE terminal.js - terminal.js's ws.onclose handler reads
         window.ServerRestartWatch to tell a restart apart from an
         ordinary disconnect. -->
    <script src="/static/js/server-restart-watch.js"></script>
    <!-- Scroll anchoring. Must load BEFORE terminal.js runs (terminal.js
         calls window.TerminalScroll from flush() and setupScrollListener()),
         and it owns the decision that used to be the racing
         autoScrollEnabled flag. -->
    <script src="/static/js/terminal-scroll.js"></script>
    <!-- Alternate-screen scrollback (claude's `tui: fullscreen`, where the
         terminal has no scrollback at all). Must load BEFORE terminal.js,
         which wires it in setupScrollListener(), and terminal-scroll.js
         calls window.AltScreenScroll from its one scroll primitive. -->
    <script src="/static/js/altscreen-scroll.js"></script>
    <!-- Clipboard tier ladder. Must load BEFORE clipboard.js,
         touch-select.js and copy-output.js, all of which copy through
         window.CopyCompat rather than navigator.clipboard (absent over
         plain http). -->
    <script src="/static/js/clipboard-compat.js"></script>
    <!-- Terminal resize pipeline. Must load BEFORE terminal.js, whose
         initTerminal() calls window.TerminalLayout.install(this). Also
         the explicit refit hook session-sidebar-pin.js calls. -->
    <!-- Shared anchored-popover placement. Must load BEFORE
         session-theme-menu.js and terminal-tools-menu.js, which both
         call window.AnchorPopover.place(). launchpad.js also calls it
         (placeNewFabMenu) but loads earlier - that is fine, because the
         call happens on a user tap, long after every script has run. -->
    <script src="/static/js/anchor-popover.js"></script>
    <!-- Terminal measurement guard. Must load BEFORE terminal-layout.js
         and terminal.js, both of which fit through
         window.TerminalMetrics.guardedFit so an untrustworthy cell
         measurement is skipped instead of being shipped to tmux. -->
    <script src="/static/js/terminal-metrics.js"></script>
    <script src="/static/js/terminal-layout.js"></script>
    <script src="/static/js/terminal.js"></script>
    <!-- Clipboard tools: local-clipboard paste + terminal copy chord.
         No UI of its own any more - the session tools menu calls
         ClipboardTools.pasteFromClipboard(). Must load AFTER terminal.js,
         which calls handleCopyChord() from its key handler. -->
    <script src="/static/js/clipboard.js"></script>
    <!-- Touch selection: long-press → drag → floating copy button on
         coarse-pointer devices. Must load AFTER terminal.js — terminal.js
         calls window.TouchSelect.init() from initTerminal(). -->
    <script src="/static/js/touch-select.js"></script>
    <!-- Copy-output sheet: url/code chips + selectable raw text. Must
         load AFTER terminal.js (terminal.js wires the button from
         initTerminal) and AFTER output-scan.js, whose scan() it calls. -->
    <script src="/static/js/output-scan.js"></script>
    <script src="/static/js/copy-output.js"></script>
    <script src="/static/js/dpad.js"></script>
    <!-- Display-only shortening of a command's full description. Must load
         BEFORE both files below: the filter reads the FULL value off the
         row, the renderer writes the shortened one into it. -->
    <script src="/static/js/command-description.js"></script>
    <script src="/static/js/slash-command-filter.js"></script>
    <script src="/static/js/slash-commands.js"></script>
    <!-- Item 9: deep-link router. Must load AFTER auth.js + launchpad.js
         so it can call into them once a `/session/<name>` URL is parsed. -->
    <script src="/static/js/router.js"></script>

    <!-- Phase 2: theme registry + selector. Must load BEFORE app.js so
         App.init() can call Themes.init() / ThemeSelector.mount(). -->
    <script src="/static/js/themes/registry.js"></script>
    <script src="/static/js/themes/themeSelector.js"></script>

    <!-- v0.7.0+ — per-theme background music plumbing. Must load BEFORE
         app.js so window.ThemeAudio is defined when the app wires the
         header toggle button + calls ThemeAudio.init().
         themeAudioNode.js holds the per-node mechanics (build, ramp, play,
         tear down) and themeAudioSettings.js holds persistence plus the
         stored-settings migration. Both MUST load first: themeAudio.js
         calls into window.ThemeAudioNode and window.ThemeAudioSettings. -->
    <script src="/static/js/themeAudioNode.js"></script>
    <script src="/static/js/themeAudioSettings.js"></script>
    <!-- themeAudioVolume.js owns the master gain, its floor and its
         live-apply hook. AFTER themeAudioSettings.js (it reads the floor
         and the persistence contract), BEFORE themeAudio.js. -->
    <script src="/static/js/themeAudioVolume.js"></script>
    <script src="/static/js/themeAudio.js"></script>
    <!-- themeAudioStatus.js reads window.ThemeAudio.getStatus(), so it loads
         AFTER themeAudio.js. It is what makes a silent failure speak: the
         music control asks it why nothing is playing and shows the answer. -->
    <script src="/static/js/themeAudioStatus.js"></script>

    <!-- Per-session theme picker + per-session music opt-in, mounted on
         the terminal screen. Must load AFTER themes/registry.js
         (window.Themes.getActiveSession / applyGlobal / listAll) and
         AFTER themeAudio.js (window.ThemeAudio). -->
    <script src="/static/js/session-theme-menu.js"></script>

    <!-- Session sidebar - conversation switcher. Must load AFTER api.js
         (window.API) and BEFORE app.js is invoked (app.js's showTerminal /
         returnToExistingTerminal / showLaunchpad / showAuth call into
         window.SessionSidebar; script order below only needs it defined
         before those methods RUN, not before app.js parses). -->
    <!-- Row markup for the sidebar list; must load BEFORE session-sidebar.js
         paints. -->
    <script src="/static/js/session-sidebar-rows.js"></script>
    <script src="/static/js/session-sidebar.js"></script>
    <!-- Pin-the-bar-open behavior. Must load AFTER session-sidebar.js
         (window.SessionSidebar) — SessionSidebar.init() calls into it. -->
    <script src="/static/js/session-sidebar-pin.js"></script>

    <!-- Settings panel — gear-icon modal folding in the theme chooser
         (moved here from the header, see #settingsBtn's comment) plus the
         agent/notifications/server sections. Must load AFTER api.js
         (window.API), themes/registry.js + themes/themeSelector.js
         (window.Themes / window.ThemeSelector — mounted into the panel's
         appearance section on open, not into `.header .controls` any
         more), and BEFORE app.js so App.init() can wire #settingsBtn's
         click handler to window.SettingsPanel.open(). -->
    <!-- Launch-wrapper list/editor mounted inside the settings panel's
         "agent" section. Must load AFTER api.js (window.API) and BEFORE
         settings-panel.js calls window.AgentWrappersPanel.mount(). -->
    <!-- agent-wrappers-view.js holds the wrappers screen's pure render
         functions and MUST load before the panel that calls them. -->
    <script src="/static/js/agent-wrappers-view.js"></script>
    <script src="/static/js/agent-wrappers-panel.js"></script>
    <!-- Terminal-command list/editor for the settings panel's "terminal"
         tab. Same contract as agent-wrappers-panel.js: AFTER api.js,
         BEFORE settings-panel.js mounts it. -->
    <script src="/static/js/terminal-commands-panel.js"></script>
    <!-- Settings modal internals. settings-tabs.js owns the tab strip and
         settings-sections.js the section markup; both must load BEFORE
         settings-panel.js, which reads window.SettingsSections at IIFE
         time. -->
    <script src="/static/js/settings-tabs.js"></script>
    <script src="/static/js/settings-sections.js"></script>
    <!-- The global music volume row in the general tab. Reads
         window.ThemeAudio for the current gain and the floor, so it loads
         AFTER themeAudio.js and BEFORE settings-panel.js renders it. -->
    <script src="/static/js/settings-audio.js"></script>
    <script src="/static/js/settings-panel.js"></script>

    <!-- Vendored CodeMirror 6 (see client/vendor/codemirror/VERSION.md) -
         served from this app's own origin so it satisfies the CSP's
         script-src 'self' with no CDN and no policy change. Exposes
         window.CodeMirrorBundle. Must load BEFORE config-editor-modal.js. -->
    <script src="/static/vendor/codemirror/codemirror-bundle.js"></script>

    <!-- Config/project file tree + editor. Must load AFTER api.js
         (window.API) and BEFORE app.js so App.init() can wire
         #configEditorBtn's click handler to window.ConfigEditorPanel.open(). -->
    <script src="/static/js/markdown-lite.js"></script>
    <!-- Escape routing / scroll lock / focus restore for the picker+editor
         pair. Must load BEFORE both of them. -->
    <script src="/static/js/modal-stack.js"></script>
    <script src="/static/js/config-editor-modal.js"></script>
    <!-- "new file" prompt. Must load BEFORE config-editor-panel.js, whose
         header button calls window.ConfigEditorNewFile.open(). -->
    <script src="/static/js/config-editor-new-file.js"></script>
    <!-- Root table + working-directory resolver + the "why is this root
         absent" sentences. Must load BEFORE config-editor-panel.js, which
         reads window.ConfigEditorRoots.ROOTS at class-definition time. -->
    <script src="/static/js/config-editor-roots.js"></script>
    <script src="/static/js/config-editor-panel.js"></script>

    <!-- Mobile header dropdown. Must load AFTER dismiss-guard.js
         (window.DismissGuard). It re-parents the existing header control
         nodes rather than cloning them, so it is order-independent with
         respect to app.js wiring their click handlers - the listeners
         travel with the nodes. -->
    <script src="/static/js/header-menu.js"></script>

    <!-- Header title middle-elision. Must load BEFORE app.js so
         setHeaderIdentity() can hand it the full session name on the very
         first paint instead of writing textContent directly. Degrades to
         the CSS end-ellipsis in styles.css if it is absent. -->
    <script src="/static/js/header-title-fit.js"></script>

    <!-- The two session-scoped FAB menus. fab-menu.js carries the shared
         open/close/dismiss/wire machinery and MUST load first; the two
         modules below only declare their own rows.

         Both must load AFTER anchor-popover.js (placement), copy-output.js,
         clipboard.js and session-theme-menu.js, whose exported functions
         their rows call. terminal.js hands each of them the Terminal
         wrapper from _applyTerminalTools() / _applySessionEditor(). -->
    <script src="/static/js/fab-menu.js"></script>
    <!-- The paste fallback. Called by clipboard.js at runtime only, so
         the order between the two does not matter, but it must load
         after fab-menu.js whose notify() it reports through. -->
    <script src="/static/js/paste-fallback.js"></script>
    <script src="/static/js/terminal-tools-menu.js"></script>
    <script src="/static/js/session-editor-menu.js"></script>
    <!-- The home bar's server-controls menu. Same shared plumbing, but
         APP-scoped rather than session-scoped, which is why it mounts on
         the home screen and the two above do not. Must load after
         fab-menu.js and anchor-popover.js; launchpad.js wires it on
         render, so the order relative to launchpad.js does not matter. -->
    <!-- The server-status panel behind that menu's first row. Split in
         two: the format module is pure and testable with no DOM, the
         panel owns the fetch, the overlay and the one destructive
         control. Must load BEFORE server-controls-menu.js only in the
         sense that the row calls window.ServerStatusPanel lazily on
         click, so strict order is not required - but keeping them
         adjacent is how the pair stays findable. Both need api.js
         (loaded far above) and session-row-actions.js, which owns the
         confirmation copy and the two destruction endpoints. -->
    <script src="/static/js/server-status-format.js"></script>
    <script src="/static/js/server-status-panel.js"></script>
    <script src="/static/js/server-controls-menu.js"></script>

    <!-- App Controller (extracted for CSP compliance) -->
    <script src="/static/js/app.js"></script>

    <!-- v0.7.0 Part 2 — toast notifications container. Fixed top-right via
         CSS (toast.css). aria-live=polite so screen readers announce new
         toasts without interrupting current UI focus. Toast cards are
         appended here by client/js/toast.js (ToastManager). -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- THE TWO SESSION-SCOPED FAB MENUS, split by JOB and by how often
         you reach for them.

         TERMINAL TOOLS (bottom row, slot 0, the right edge) moves content
         across the terminal's boundary: copy output, paste from
         clipboard, attach image. It stays on the bottom row with the
         d-pad, over the command line, because it is used all day.

         SESSION EDITOR (top-right rail) configures the session itself:
         theme and music. Set once per session, so it is out of the
         working row entirely. Two coherent groups with a rule a user can
         learn, not one drawer of everything.

         Both are direct children of <body>. NOTHING may move inside
         #terminal: TerminalScroll.blockOverscrollEscape calls
         preventDefault on single-touch drags there, so a control mounted
         inside it loses its gestures.

         The hidden file input is the "attach file" path, opened
         programmatically by that menu row; the change handler lives in
         clipboard.js (ClipboardTools.wireFileInput).

         Icon geometry is the terminal-tool set exactly: 16x16 in a
         0 0 16 16 viewBox with stroke-width declared PER PATH. A
         presentation attribute on the path beats a stylesheet rule that
         targets the svg, so the value has to be right here. -->
    <input type="file" id="cloude-image-attach-input" hidden />

    <!-- Clipboard glyph: all three rows are content crossing the boundary. -->
    <button type="button" id="terminalToolsBtn" class="fab-menu-btn terminal-tools-fab"
            aria-haspopup="menu" aria-expanded="false" aria-controls="terminalToolsMenu"
            aria-label="terminal tools" title="terminal tools">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M5.5 2.5h-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-10a1 1 0 0 0-1-1h-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="5.5" y="1.5" width="5" height="2.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 8h4M6 10.5h2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Sliders glyph: this one CONFIGURES rather than moves anything. -->
    <button type="button" id="sessionEditorBtn" class="fab-menu-btn session-editor-fab"
            aria-haspopup="menu" aria-expanded="false" aria-controls="sessionEditorMenu"
            aria-label="session editor" title="session editor">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4.5h5M10 4.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2 11.5h4M9 11.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8.5" cy="4.5" r="1.6" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="7.5" cy="11.5" r="1.6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
</body>
</html>
